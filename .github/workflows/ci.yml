name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # The desktop layer is Windows-only, so the whole suite runs there.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DeskKit.slnx

      - name: Build
        run: dotnet build DeskKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DeskKit.slnx --configuration Release --no-build
